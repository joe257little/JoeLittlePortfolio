le", "syncvault", "platform-b", "royal-academy", "we-out-here"], "brand": ["indie-spirit", "casamigos", "pop-up", "needle-mythology", "mahogany", "estrella-frieze", "brands-how"]}, "entries": {"love-island": {"title": "Love Island: The Morning After", "role": "Podcast Engineer / Sound Operator", "meta": "ITV / Soho Radio Productions", "size": "compact", "copy": ["ITV's official companion podcast to Love Island, produced with Soho Radio Productions. I operated the live and pre-recorded audio workflows and ran studio engineering and post-production."], "facts": [["Client", "ITV"], ["Produced with", "Soho Radio Productions"]], "links": [["Listen on Spotify", "https://open.spotify.com/episode/7gc8VEB2JaWpubj2NL88kg?si=e52df05b38c1417d"]], "img": "85e7078dd5171f29bd4bc5a2a441db59", "w": 960, "pics": [], "alt": "", "ph": "", "todo": ""}, "screenshot": {"title": "Screenshot with Ellen E Jones and Mark Kermode", "role": "Sound Engineer and Operator", "meta": "BBC", "size": "full", "copy": ["The BBC's film and culture podcast. I engineered and delivered studio and remote recordings and kept the audio at broadcast quality across fast-turnaround episodes.", "That meant managing mic set-ups and signal flow, recording and post-production, and working closely with the presenters and production team to hold a consistent, polished sound."], "facts": [["Client", "BBC"], ["Presenters", "Ellen E Jones, Mark Kermode"], ["Work", "Studio and remote recording, post-production"]], "links": [["Listen: Frankenstein episode", "https://open.spotify.com/episode/479pjX3Z2IK8JD4Wc1x7AI?si=e2ad3325492344ea"]], "img": "cd250cf54703b13c0ec6cd09ff9a2f88", "w": 465, "pics": [], "alt": "Screenshot podcast artwork", "ph": "", "todo": ""}, "meltdown": {"title": "The Meltdown with Ross Allen", "role": "Lead Producer and Engineer", "meta": "Soho Radio", "size": "full", "copy": ["DJ and broadcaster Ross Allen's weekly live show on Soho Radio. I booked and briefed the guests, engineered the live sessions, re dio and multi-camera set-up, edit and mix audio, and quality-check every episode before release.", "I run the studio calendar, workflows, equipment planning and maintenance, and I set up the studio's recording rig and acoustic treatment. I have also had a hand in editing many episodes across all three series. The same work extends to short documentary films: see Film & Documentary Sound."], "facts": [["Employer", "HENI"], ["Series", "Stories of Art, Stories of Architecture, History of Ceramics (soon Stories of Ceramics)"], ["Editing", "Many episodes across all three series"], ["Studio", "Multi-camera video podcast studio"]], "links": [["HENI Talks podcasts", "https://heni.com/talks/podcasts"]], "img": "fb3892102bd77f41c2b2d129a4144a86", "w": 1024, "pics": ["c3a61cddfcacdb6b6cd55977b25fef07", "40e9f64844c8525128c3a749685159f1"], "videos": [{"url": "https://www.youtube.com/watch?v=iGOF54ph7l0&t=11s", "title": "Stories of Art: Sandro Botticelli (Part 1)"}], "alt": "", "ph": "", "todo": ""}, "living-in-my-headphones": {"title": "Living in My Headphones with James Lavelle", "role": "Producer and Engineer", "meta": "Soho Radio", "size": "full", "copy": ["One of Soho Radio's most popular long-running shows, relaunched with a full rebrand and a new three-hour format.", "I produced and engineered it: running orders, audio production and editing, and new recurring segments that deepen the show's storytelling and boost audience engagement."], "facts": [["Station", "Soho Radio"], ["Presenter", "James Lavelle"], ["Format", "Three hours, relaunched with a full rebrand"], ["Work", "Running orders, engineering, audio production, editing, new segments"]], "links": [["Listen", "https://www.dropbox.com/scl/fi/4lz1js50r50j0ip9d6ttg/Living-In-My-Headphones-with-James-Lavelle-02.11.2025-ID.mp3?rlkey=1jfqjbc9qgg6kj58uo1iffjbz&st=9db88khb&dl=0"], ["Social trailer", "https://www.instagram.com/p/DQe6RgEjHnp/"]], "img": "5087091239f3d4228577aef4f8c59480", "w": 1400, "pics": [], "alt": "Living in My Headphones artwork", "ph": "", "todo": ""}, "kate-hutchinson": {"title": "Kate Hutchinson with Brian Jackson", "role": "Producer and Engineer", "meta": "Soho Radio", "size": "full", "copy": ["A special episode of Kate Hutchinson's bi-weekly show with Brian Jackson, whose credits include Gil Scott-Heron and Roy Ayers.", "I looked after guest coordination and liaison, research, visual content production and social uploads, and delivered a candid, wide-ranging conversation on music, activism and legacy."], "facts": [["Station", "Soho Radio"], ["Host", "Kate Hutchinson"], ["Guest", "Brian Jackson"], ["Work", "Producing, editing, engineering, guest liaison, social content"]], "links": [["Listen", "https://www.mixcloud.com/sohoradio/kate-hutchinson-feat-brian-jackson-30052025/"], ["Social clip", "https://www.instagram.com/p/DKre_E1ok4-/"]], "img": "d784a912673f7c9502e5d96bc9f740fd", "w": 1000, "pics": [], "alt": "Kate Hutchinson and Brian Jackson outside the Soho Radio studio", "ph": "", "todo": ""}, "101-part-time-jobs": {"title": "101 Part Time Jobs with Yasi Salek", "role": "Producer and Production Co-ordinator", "meta": "Interview podcast", "size": "full", "copy": ["An in-depth conversation between Yasi Salek (Bandsplain, The Ringer) and host Giles Bidder for 101 Part Time Jobs.", "I produced this episode."], "facts": [["Guest", "Yasi Salek"], ["Host", "Giles Bidder"], ["Work", "Production co-ordination, recording, location booking, logistics"]], "links": [["Listen on Spotify", "https://open.spotify.com/episode/3loxFFlCzzXwKqPrgjul7l?si=6f6a8c40c37a4c88"], ["Social clip", "https://www.instagram.com/reel/DNQO6yTP9U5/"]], "img": "e92193fa40105e5b9f02990d0b13ad61", "w": 447, "pics": [], "videos": [], "alt": "Yasi Salek and Giles Bidder, 101 Part Time Jobs episode artwork", "ph": "", "todo": ""}, "off-the-telly": {"title": "Off The Telly", "role": "Sound Engineer and Operator", "meta": "BBC", "size": "brief", "copy": ["Recorded and engineered at Soho Radio Productions for external clients, alongside Love Island: The Morning After and Screenshot."], "facts": [], "links": [], "img": "e143198f7659d9f3ac4d6baf5d179113", "w": 1200, "pics": [], "alt": "", "ph": "", "todo": ""}, "editing": {"title": "Editing and mastering", "role": "", "meta": "", "size": "brief", "copy": ["Editing and mastering radio and podcast audio for online upload and broadcast, often across several productions at once in a multi-room studio."], "facts": [], "links": [], "img": null, "w": 0, "alt": "", "ph": "", "todo": ""}, "pop-up": {"title": "Soho Radio 10th Anniversary Pop-Up", "role": "Lead Producer / Event Coordinator", "meta": "Four days, Marshall Street, Soho. Supported by Peroni and Ballantine's", "size": "full", "copy": ["To mark the station's tenth anniversary, a Marshall Street shopfront in Soho became a four-day live broadcast and recording space. I led production: twenty live artist sessions recorded direct to vinyl, with schedules, logistics and a 300-record production run managed over three days.", "Each night the space turned into a bar and DJ venue and a community hub celebrating a decade of Soho Radio, with live broadcasts running through the event. It was supported by Peroni and Ballantine's."], "facts": [["Format", "Four days, live broadcast and recording space"], ["Sessions", "20 live artist sessions, recorded direct to vinyl"], ["Pressing", "300 records produced over 3 days"], ["Supported by", "Peroni, Ballantine's"]], "links": [], "img": "c850c9a324f5cb4651d6007dc124649a", "w": 1115, "pics": ["0323792b16803dd6abb6e43a62c1a90a", "19db5e0bf7f127b7881098fdce0fd051", "8dd933248ee175b7b89200025ecb5c56", "3e79a66f3625befac7a6fceb5eec99ae"], "videos": [], "alt": "A session guest in a hat beside microphones and recording equipment", "ph": "", "todo": ""}, "patta": {"title": "Patta Cypher Sessions", "role": "Audio Production", "meta": "Patta, live cypher events", "size": "full", "copy": ["I set up the audio production side of the live production for Patta's last three cypher events: installing the sound system and DJ decks, and recording the whole event reliably."], "facts": [["Events", "Patta's last three cypher events"], ["Work", "Sound system, DJ decks, full-event recording"]], "links": [["Watch the reel on Instagram", "https://www.instagram.com/reel/DfewBOZg7xz/"]], "img": "f92b79570aeba8c3d83b84959b59f84a", "w": 1400, "pics": [{"id": "58d3179568af0c24a86abc4832093a02", "url": "", "f": {"cx": 0.5, "cy": 0.452, "z": 1, "a": 0.8}}, "e5f7872ce35bb4fce1f5f1396af0b069"], "videos": [{"url": "https://www.youtube.com/watch?v=KNBq71IaTDU&t=439s", "title": "Patta SS26 Cypher"}, {"url": "https://www.youtube.com/watch?v=qTgXjb55DiQ", "title": "Patta London AW26 Cypher"}], "alt": "", "ph": "", "todo": "", "mix": ["v:KNBq71IaTDU", "v:qTgXjb55DiQ", "p:58d3179568af0c24a86abc4832093a02", "p:e5f7872ce35bb4fce1f5f1396af0b069"]}, "casamigos": {"title": "Casamigos x Soho Radio at The Blue Posts", "role": "Live Event Producer / Engineer", "meta": "Casamigos Tequila", "size": "full", "copy": ["We partnered with Casamigos Tequila to turn The Blue Posts into The Teal Posts for one night only, featuring James Lavelle (UNKLE, Mo'Wax), Simone Marie (Primal Scream) and Jay Carder.", "I managed the on-site technical set-up, sound engineering, programming and artist coordination."], "facts": [["Partner", "Casamigos Tequila"], ["Venue", "The Blue Posts"], ["Artists", "James Lavelle, Simone Marie, Jay Carder"], ["Work", "Technical set-up, sound engineering, programming, artist coordination"]], "links": [["Social wrap-up clip", "https://www.instagram.com/p/DOGs7OcjPT_/"], ["Live broadcasts", "https://www.mixcloud.com/sohoradio/playlists/casa-soho-live-from-the-blue-posts-with-casamigos/"]], "img": "f498d364ddd1a389b0d58eae7c9ec6e4", "w": 1120, "pics": ["71f2b596a82b2130f410e1cbc8267e5c", "c530e000fcdf0d135424d83404a52e8e", "5cc89450d25d9b68597cc65730d59320", "58053f18ad3755923b8dab5debf71b86"], "videos": [], "alt": "A DJ in sunglasses and headphones at the decks", "ph": "", "todo": ""}, "indie-spirit": {"title": "Indie Spirit with Georgie Rogers: Jack Daniel's", "role": "Producer / Editor", "meta": "Jack Daniel's partnership", "size": "full", "copy": ["A branded editorial campaign spotlighting emerging UK artists for Jack Daniel's Indie Spirit series. Live sessions were recorded in-studio, remotely and on location, and blended with interviews and fan-made segments into weekly episodes.", "I edited every package to deadline, advised on social and promotional content within a five-person production team, and produced three live events for the campaign.", "The partnership culminated in 4 live events featuring Kokoroko, Nilufer Yanya, The Snuts and AKA. This included a great trip up to Newcastle selling out The Boiler Shop for a live event as well as setting up a satellite radio station in a vinyl pressing plant."], "facts": [["Partner", "Jack Daniel's"], ["Presenter", "Georgie Rogers"]], "links": [["Highlight: Sampa the Great", "https://www.mixcloud.com/sohoradio/the-indie-spirit-show-with-georgie-rogers-feat-sampa-the-great-and-tom-vek-08102025/"], ["Social clip: Lava La Rue", "https://www.instagram.com/p/DRU7-RzjLHk/?hl=en"]], "img": "97408bbd6c40bb259fe0d4316f54d8fd", "w": 1120, "pics": ["img/indie-spirit-1.jpg", "e54cb2979de2591ef164df2143b577d0"], "videos": [{"url": "https://www.youtube.com/watch?v=1kdIW0eRWM4", "title": ""}, {"url": "https://www.youtube.com/watch?v=h6m4VZAoEMs&t=58s", "title": ""}], "cols": 4, "alt": "Indie Spirit Radio Show with Georgie Rogers, Revive Live artwork", "ph": "", "todo": ""}, "live-sessions": {"title": "Live Sessions at Soho Radio", "role": "Sound Engineer / Producer", "meta": "Live band and studio sessions", "size": "full", "copy": ["Live sessions were the backbone of Soho Radio, and the thing the station was known for around the world. Squeezed into a very small studio on Broadwick Street, I produced and engineered sessions for Bernard Purdie, Lava La Rue, Olive Jones, La Lom, Knats and many more. Some were cut live to vinyl, which means one take, no undo button, and a lot of quiet confidence.", "Others who made it through the door (and somehow into the room) include Corto Alto, Los Bitchos, Janet Kay, Maverick Sabre, Hak Baker, Dele Sosimi and Marc Almond."], "facts": [["Hours", "1,000+ hours of live radio production"], ["Artists", "Corto Alto, Los Bitchos, Janet Kay, Maverick Sabre, Hak Baker, Dele Sosimi, Marc Almond"]], "links": [], "img": "1f84ea990f28d64778339300cd604fd8", "w": 768, "pics": [{"id": "img/reel-janie-jones.jpg", "url": "https://www.instagram.com/reel/DU5qNeKjDFK/", "f": {"cx": 0.5, "cy": 0.6, "z": 1, "a": 0.718}}, {"id": "img/reel-lava-la-rue.jpg", "url": "https://www.instagram.com/reel/DRU7-RzjLHk/", "f": {"cx": 0.5, "cy": 0.55, "z": 1, "a": 0.718}}, {"id": "img/reel-grave-palms.jpg", "url": "https://www.instagram.com/reel/DVveXdljJie/", "f": {"cx": 0.5, "cy": 0.58, "z": 1, "a": 0.718}}, "43a5babefe2b71ad01120188eb165d4e", "549490bc95500191a71f2744164b70a6", "687478ec2416f477c373bbc8590842cb"], "videos": [{"url": "https://www.youtube.com/watch?v=udeHyhf0glo", "title": "The Lemon Twigs: Lonely (Live @ Soho Radio)"}, {"url": "https://www.youtube.com/watch?v=AheCTtp_Lek", "title": "Hak Baker: No Control!"}, {"url": "https://www.youtube.com/watch?v=hdTPrR9Y5rs", "title": "Nectar Woode: How It's Gotta Be"}, {"url": "https://www.youtube.com/watch?v=lsg4qI-oYqQ", "title": "Corto Alto: Swiftie"}], "mix": ["p:img/reel-grave-palms.jpg", "p:43a5babefe2b71ad01120188eb165d4e", "p:img/reel-janie-jones.jpg", "p:549490bc95500191a71f2744164b70a6", "p:img/reel-lava-la-rue.jpg", "v:udeHyhf0glo", "v:AheCTtp_Lek", "p:687478ec2416f477c373bbc8590842cb", "v:hdTPrR9Y5rs", "v:lsg4qI-oYqQ"], "alt": "", "ph": "", "todo": ""}, "training": {"title": "Training Volunteer Producers", "role": "Trainer / Mentor", "meta": "Soho Radio", "size": "brief", "copy": ["Trained and mentored 20+ volunteer radio producers in live session engineering and show management."], "facts": [["Trained", "20+ volunteer radio producers"], ["Covered", "Live session engineering, show management"]], "links": [], "img": null, "w": 0, "alt": "", "ph": "", "todo": ""}, "station-infra": {"title": "Station technical infrastructure", "role": "", "meta": "", "size": "brief", "copy": ["Maintained the radio station's technical infrastructure for over two years, solving broadcast and studio issues under pressure."], "facts": [], "links": [], "img": null, "w": 0, "alt": "", "ph": "", "todo": ""}, "schedule": {"title": "Station Programming at Soho Radio", "role": "Studio Manager / Senior Podcast and Radio Producer", "meta": "170+ shows a month", "size": "full", "copy": ["I led multiple station-wide schedule reshuffles: recruiting and commissioning new shows, cutting and repositioning others, and managing hundreds of presenters' expectations, whilst maintaining creative strategy across the station.", "I also worked across the Soho Radio network to cross-pollinate shows and creative talent, which widened the programming, raising the standard of broadcast across the board.", "I also produced weekly and monthly formatted shows for renowned DJs and presenters, curating segments and developing the editorial running orders. I booked and co-ordinated the guests for Ross Allen's shows through the year and for Georgie Rogers' Indie Spirit Show, with highlights including Don Letts, Maverick Sabre, Jeff Mills, Arthur Baker, Kara Jackson and Ron Trent.", "Beyond the music, I produced chat shows across a wide range of subjects, from Extinction Rebellion discussions to poetry talks with Rough Trade Books, building the running orders and editorial structure for both music-led and talk-led programming.", "I played a key role in the full rebrand of Soho Radio, including the new website and app, coordinating the creative, technical and marketing teams. That covered organising the launch party and producing the promotional assets, both visual and audio."], "facts": [["Scale", "170+ shows a month"], ["Presenters", "Hundreds, including Norman Jay, Ross Allen, Kate Hutchinson, James Lavelle, Georgie Rogers, Pete Paphides and DJ Prime Cuts"], ["Guests", "Don Letts, Maverick Sabre, Jeff Mills, Arthur Baker, Kara Jackson, Ron Trent, Brian Jackson"], ["Talk shows", "Activism, poetry, music and culture"], ["Work", "Schedule reshuffles, commissioning, recruitment, running orders, segment curation, research, scripting, guest booking, station rebrand, new website and app"]], "links": [], "img": "9b6d77736a281ebe4025807bd463be9b", "w": 928, "pics": [], "videos": [{"url": "https://www.youtube.com/watch?v=h6m4VZAoEMs", "title": "Nilufer Yanya at Metropolis Studios"}, {"url": "https://www.youtube.com/watch?v=aI01__cOqjc", "title": "Nectar Woode Live to Vinyl Session"}, {"url": "https://www.youtube.com/watch?v=KtxHi3Zc8Mo&t=5s", "title": "Soho Radio Live to Vinyl Sessions"}], "alt": "", "ph": "", "todo": ""}, "syncvault": {"title": "SyncVault: Catalogue Curation and A&R", "role": "", "meta": "", "size": "brief", "copy": ["Campaign co-ordinator, distribution manager and A&R for a commercial music catalogue for YouTubers: 600+ campaigns with artists such as Jungle, GROVE and Prima Queen, a team of eight account managers, and a CRM I built for sign-ups, assets and contracts."], "facts": [], "links": [], "img": null, "w": 0, "alt": "", "ph": "", "todo": ""}, "platform-b": {"title": "Platform B FM", "role": "", "meta": "", "size": "brief", "copy": ["Producer, DJ and presenter at the radio station Platform B FM."], "facts": [], "links": [], "img": null, "w": 0, "alt": "", "ph": "", "todo": ""}, "royal-academy": {"title": "Royal Academy of Arts sound design workshop", "role": "", "meta": "", "size": "brief", "copy": ["Assisted Peter Adjaye on a sound design workshop alongside the Anthony Gormley exhibition. Young people from colleges and schools around London made musical responses to the work."], "facts": [], "links": [], "img": null, "w": 0, "alt": "", "ph": "", "todo": ""}, "we-out-here": {"title": "We Out Here Festival", "role": "", "meta": "", "size": "brief", "copy": ["Press team and artist liaison."], "facts": [], "links": [], "img": null, "w": 0, "alt": "", "ph": "", "todo": ""}, "mahogany": {"title": "Mahogany Creative", "role": "Project Support / Brand Partnerships Manager", "meta": "Brand partnerships", "size": "full", "copy": ["Time in the production team at Mahogany Creative, supporting music-led brand campaigns including a branded performance series at Glastonbury 2023, a live-session series for KEF Audio and a documentary series for Nikon.", "My part was support: pitch preparation, creative strategy, artist coordination and on-set production, plus client communications, project timelines and campaign reporting."], "facts": [], "links": [], "img": null, "w": 0, "pics": [], "videos": [{"url": "https://www.youtube.com/watch?v=iW66ONYeTgc&t=3s", "title": "Jalen Ngonda for Mahogany Creative Live Session"}], "alt": "", "ph": "", "todo": ""}, "estrella-frieze": {"title": "Estrella Galicia and Frieze Festival", "role": "", "meta": "", "size": "brief", "copy": ["Branded content and partnership campaigns planned and delivered through Soho Radio, co-ordinating schedules, technical delivery and stakeholders."], "facts": [], "links": [], "img": null, "w": 0, "alt": "", "ph": "", "todo": ""}, "brands-how": {"title": "How I work with brands", "role": "", "meta": "", "size": "brief", "copy": ["Client communications, project timelines, campaign reporting, artist coordination and on-set production support, from concept to delivery."], "facts": [], "links": [], "img": null, "w": 0, "alt": "", "ph": "", "todo": ""}, "film-sound": {"title": "Sound for short documentary films", "role": "Sound Operator / Sound Editor / Sound Designer", "meta": "Mostly for HENI Talks", "size": "full", "copy": ["I'm proficient in tape syncing, on-set sound operation, and sound design and editing for short documentary films. Most of this work has been made for HENI Talks, alongside the podcast series.", "On set, I operate location sound for HENI's films, including multi-day shoots away, working alongside the camera team and keeping recordings organised for the edit. In post, I sync sound to picture, clean and edit dialogue, build the sound design and mix and master the finished film."], "facts": [["Tape syncing", "Syncing recorded sound to camera, including multi-camera material"], ["On set", "Location sound operation on HENI film shoots, including multi-day trips away"], ["Post", "Dialogue editing, sound design and mixing"], ["Mostly for", "HENI Talks"]], "links": [], "img": "bad1850dabe3b1c0599f4e0bb8ba9068", "w": 1050, "pics": [], "videos": [], "alt": "", "ph": "", "todo": ""}, "film-mix": {"title": "Sound Design and Mixing", "role": "Sound Mixer", "meta": "HENI Talks Films", "size": "compact", "copy": ["I take HENI Talks films from the finished picture edit to a finished mix, working in DaVinci Resolve's Fairlight page. I sync and organise the sound, repair and edit the dialogue, then build the mix in stems: dialogue, voice-over, music and sound effects, each on its own bus into a final main mix.", "That means cleaning noise and room sound from interviews and voice-over, shaping the voices with EQ and compression so they sit clearly, laying in music and sound effects that support the story, and balancing everything around the dialogue. I finish with gentle compression and limiting on the main out, and check a test render before exporting the film for YouTube.", "A recent example is the HENI Talks film on the artist BÄST, where I did the full sound mix, edit and master."], "facts": [["Stems", "Dialogue, voice-over, music, sound effects"], ["Process", "Sync, dialogue edit and repair, sound design, mix, export"], ["Delivery", "YouTube"]], "links": [], "img": "173eb77a8aa9c41e6fabdea5b3f6c666", "w": 1050, "pics": [], "alt": "", "ph": "", "todo": "", "videos": [{"url": "https://www.youtube.com/watch?v=3xpA2xiqt98", "title": "BÄST: The Brooklyn Artist Banksy Called a Legend"}]}, "needle-mythology": {"title": "Needle Mythology", "role": "Project and Product Manager", "meta": "Vinyl label run by Pete Paphides", "size": "full", "copy": ["I work as Project and Product Manager for Needle Mythology, the label run by Pete Paphides, overseeing physical vinyl releases from creative ideation to final production, with artists, photographers, graphic designers and pressing plants.", "That includes Sensitive, the critically acclaimed indiepop anthology compiled by Pete Paphides and released on double vinyl and 2CD; the deluxe reissues of The Lilac Time's records; and Think Once More, the first anthology of The Montgolfier Brothers, on vinyl and CD."], "facts": [["Work", "Project and product management of vinyl releases"], ["Releases", "Sensitive, The Lilac Time reissues, The Montgolfier Brothers anthology"], ["Formats", "Vinyl, deluxe box sets, CD"]], "links": [["Sensitive", "https://needlemythology.com/releases/sensitive/"], ["Stephen Duffy and The Lilac Time", "https://needlemythology.com/releases/stephen-duffy-and-the-lilac-time/"], ["The Montgolfier Brothers", "https://needlemythology.com/releases/montgolfier-brothers/"]], "img": "6891226ec357c797676230872aea92ea", "w": 249, "pics": [{"id": "img/needle-sensitive-vinyl.jpg", "url": "https://needlemythology.com/releases/sensitive/"}, {"id": "img/needle-sensitive-cd.jpg", "url": "https://needlemythology.com/releases/sensitive/"}, {"id": "img/needle-lilac-time.jpg", "url": "https://needlemythology.com/releases/stephen-duffy-and-the-lilac-time/"}, {"id": "img/needle-montgolfier.jpg", "url": "https://needlemythology.com/releases/montgolfier-brothers/"}], "videos": [], "alt": "", "ph": "", "todo": ""}}}</script><script src="app.js" defer></script></body></html>
